# Render.com deployment blueprint.
# In Render: New → Blueprint → connect the repo containing this file.
# Render reads this automatically. You only need to add the secret keys
# (GEMINI_API_KEY, TAVILY_API_KEY) in the dashboard — they are intentionally
# NOT stored here.
services:
  - type: web
    name: bmi-copilot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set in the Render dashboard (secret)
      - key: TAVILY_API_KEY
        sync: false          # set in the Render dashboard (secret)
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: ENABLE_GROUNDING
        value: "true"
